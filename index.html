<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>유튜브 재생 - 플레이브 흥흥흥</title>
    <style>
        /* 기본 배경을 하늘색으로 설정 및 중앙 정렬 */
        body {
            margin: 0;
            padding: 20px;
            background-color: #e0f2fe; /* 하늘색 배경 */
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 전체 레이아웃 구역 (두 개의 세트가 들어가는 컨테이너) */
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            gap: 40px; /* 첫 번째 세트와 두 번째 세트 사이의 간격 */
        }

        /* [동영상 + 소개글] 한 세트를 묶어주는 상자 */
        .video-set {
            display: flex;
            align-items: center; /* 영상과 글씨의 높이를 가운데로 맞춤 */
            gap: 20px; /* 영상과 소개글 사이의 간격 */
            background: rgba(255, 255, 255, 0.5); /* 글씨가 잘 보이도록 반투명 흰색 배경 추가 */
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        /* 동영상이 들어가는 구역 (서로 1:1 크기 유지) */
        .video-box {
            flex: 1; /* 영상을 좌우 균등하게 1:1 비율로 맞춤 */
            position: relative;
            width: 100%;
            padding-top: 28%; /* 1:1 화면 안에서 16:9 유튜브 비율을 맞추기 위한 수치 */
        }

        /* iframe 실측 스타일 */
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* 동영상 바로 옆 소개글 스타일 */
        .video-text {
            flex: 1; /* 글씨 구역도 균등하게 공간을 나눠 가짐 */
            font-size: 28px; /* 글씨 크기 (큼직하게 설정) */
            font-weight: bold;
            color: #1e3a8a; /* 진한 파란색 글씨 */
            padding-left: 10px;
            word-break: keep-all;
        }

        /* 화면이 좁아지는 모바일 환경 대응 */
        @media (max-width: 768px) {
            .video-set {
                flex-direction: column;
                align-items: flex-start;
            }
            .video-box {
                padding-top: 56.25%;
            }
            .video-text {
                padding-top: 10px;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="video-set">
            <div class="video-box">
                <iframe 
                    src="https://www.youtube.com/embed/K-F7906Jq9U" 
                    title="플레이브 영상 1" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-text">플레이브 흥흥흥</div>
        </div>

        <div class="video-set">
            <div class="video-box">
                <iframe 
                    src="https://www.youtube.com/embed/cFm8fTRW_so?playlist=cFm8fTRW_so&loop=1" 
                    title="플레이브 영상 2" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="video-text">플레이브 기다릴게</div>
        </div>

    </div>

</body>
</html>
