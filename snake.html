<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스네이크 게임</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e2e8f0;
      background: #050816;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.22), transparent 24%),
                  radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.18), transparent 24%),
                  linear-gradient(180deg, #020617 0%, #090d1f 100%);
    }

    .game-shell {
      width: min(100%, 900px);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1.5rem;
    }

    .panel,
    .status {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 1.25rem;
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.18);
      padding: 1.5rem;
    }

    .panel {
      display: grid;
      gap: 1rem;
    }

    canvas {
      width: 100%;
      border-radius: 1.1rem;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.4rem);
    }

    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.8;
    }

    .score-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .score-box {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
    }

    .score-box strong {
      display: block;
      font-size: 1.1rem;
      color: #f8fafc;
      margin-bottom: 0.35rem;
    }

    .score-box span {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .controls {
      display: grid;
      gap: 0.8rem;
    }

    button {
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(59, 130, 246, 0.15));
      color: #eff6ff;
      font-weight: 700;
      border-radius: 0.95rem;
      padding: 0.95rem 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(59, 130, 246, 0.2));
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .info {
      display: grid;
      gap: 0.65rem;
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .key-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .key-item {
      padding: 0.85rem 1rem;
      border-radius: 0.95rem;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .key-item strong {
      display: block;
      color: #f8fafc;
      margin-bottom: 0.3rem;
    }

    @media (max-width: 860px) {
      .game-shell {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 1rem;
      }
      .panel,
      .status {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <section class="panel">
      <div>
        <h1>스네이크 게임</h1>
        <p>화살표 또는 WASD 키로 스네이크를 움직여 과일을 먹고 점수를 올려보세요. 벽과 자기 몸에 부딪히면 게임 오버입니다.</p>
      </div>
      <canvas id="gameCanvas" width="720" height="480" aria-label="스네이크 게임 화면"></canvas>
    </section>

    <aside class="status">
      <div class="score-board">
        <div class="score-box">
          <strong>점수</strong>
          <span id="scoreValue">0</span>
        </div>
        <div class="score-box">
          <strong>최고 기록</strong>
          <span id="highScoreValue">0</span>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn" type="button">시작</button>
        <button id="pauseBtn" type="button" disabled>일시 정지</button>
        <button id="restartBtn" type="button" disabled>다시 시작</button>
      </div>

      <div class="info">
        <p id="statusText">게임을 시작하려면 시작 버튼을 누르세요.</p>
        <div class="key-list">
          <div class="key-item"><strong>이동:</strong> 화살표 / WASD</div>
          <div class="key-item"><strong>재시작:</strong> R</div>
          <div class="key-item"><strong>일시 정지:</strong> P</div>
          <div class="key-item"><strong>시작:</strong> Enter</div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreValue = document.getElementById('scoreValue');
    const highScoreValue = document.getElementById('highScoreValue');
    const statusText = document.getElementById('statusText');
    const STORAGE_KEY = 'snake-game-highscore-v1';

    const tileSize = 24;
    const columns = canvas.width / tileSize;
    const rows = canvas.height / tileSize;

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let speed;
    let gameLoopId;
    let isRunning = false;
    let isPaused = false;
    let highScore = 0;

    function loadHighScore() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved !== null) {
        highScore = Number(saved) || 0;
      }
      highScoreValue.textContent = highScore;
    }

    function saveHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY, highScore);
        highScoreValue.textContent = highScore;
      }
    }

    function createFood() {
      const available = [];
      for (let x = 0; x < columns; x += 1) {
        for (let y = 0; y < rows; y += 1) {
          if (!snake.some(segment => segment.x === x && segment.y === y)) {
            available.push({ x, y });
          }
        }
      }
      if (available.length === 0) return null;
      return available[Math.floor(Math.random() * available.length)];
    }

    function resetGame() {
      snake = [
        { x: Math.floor(columns / 2), y: Math.floor(rows / 2) },
        { x: Math.floor(columns / 2) - 1, y: Math.floor(rows / 2) },
        { x: Math.floor(columns / 2) - 2, y: Math.floor(rows / 2) },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = createFood();
      score = 0;
      speed = 120;
      updateScore();
      statusText.textContent = '게임 준비 완료. 시작 버튼 또는 Enter를 누르세요.';
      pauseBtn.disabled = true;
      restartBtn.disabled = true;
    }

    function updateScore() {
      scoreValue.textContent = score;
    }

    function isCollision(head) {
      if (head.x < 0 || head.x >= columns || head.y < 0 || head.y >= rows) {
        return true;
      }
      return snake.slice(1).some(segment => segment.x === head.x && segment.y === head.y);
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
    }

    function drawGrid() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function render() {
      drawGrid();
      if (food) {
        drawCell(food.x, food.y, '#fb7185');
      }
      snake.forEach((segment, index) => {
        const color = index === 0 ? '#f8fafc' : '#38bdf8';
        drawCell(segment.x, segment.y, color);
      });
    }

    function gameOver() {
      window.cancelAnimationFrame(gameLoopId);
      isRunning = false;
      isPaused = false;
      saveHighScore();
      statusText.textContent = `게임 오버! 점수 ${score}점. R을 눌러 다시 시작하세요.`;
      pauseBtn.disabled = true;
      restartBtn.disabled = false;
    }

    function step() {
      updateDirection();
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      if (isCollision(head)) {
        gameOver();
        return;
      }
      snake.unshift(head);
      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        updateScore();
        food = createFood();
        speed = Math.max(60, speed - 4);
      } else {
        snake.pop();
      }
      render();
      gameLoopId = window.setTimeout(() => {
        requestAnimationFrame(step);
      }, speed);
    }

    function startGame() {
      if (isRunning) return;
      if (!food) food = createFood();
      isRunning = true;
      isPaused = false;
      pauseBtn.disabled = false;
      restartBtn.disabled = true;
      statusText.textContent = '게임 중입니다. 방향키로 이동하세요.';
      step();
    }

    function pauseGame() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        window.clearTimeout(gameLoopId);
        statusText.textContent = '일시 정지되었습니다. Enter 또는 시작 버튼으로 다시 시작하세요.';
        pauseBtn.textContent = '계속';
      } else {
        pauseBtn.textContent = '일시 정지';
        statusText.textContent = '게임 재개됨.';
        step();
      }
    }

    function restartGame() {
      window.clearTimeout(gameLoopId);
      resetGame();
      isRunning = false;
      isPaused = false;
      pauseBtn.textContent = '일시 정지';
      startGame();
    }

    function handleKey(event) {
      const key = event.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') {
        if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
      if (key === 'arrowdown' || key === 's') {
        if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
      }
      if (key === 'arrowleft' || key === 'a') {
        if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
      }
      if (key === 'arrowright' || key === 'd') {
        if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
      }
      if (key === 'enter') {
        if (!isRunning) startGame();
      }
      if (key === 'p') {
        if (isRunning) pauseGame();
      }
      if (key === 'r') {
        restartGame();
      }
    }

    function updateDirection() {
      if (nextDirection.x !== direction.x || nextDirection.y !== direction.y) {
        direction = nextDirection;
      }
    }

    startBtn.addEventListener('click', () => {
      updateDirection();
      startGame();
    });
    pauseBtn.addEventListener('click', pauseGame);
    restartBtn.addEventListener('click', restartGame);
    window.addEventListener('keydown', handleKey);

    function initialize() {
      loadHighScore();
      resetGame();
      render();
    }

    initialize();
  </script>
</body>
</html>
