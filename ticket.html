<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>콘서트 좌석 선택</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070915;
      color: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 22%),
                  radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.16), transparent 24%),
                  linear-gradient(180deg, #020617 0%, #090e1d 100%);
    }

    .page {
      width: min(100%, 1080px);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.25);
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1px;
    }

    .main {
      padding: 2rem;
      display: grid;
      gap: 1.25rem;
      background: rgba(15, 23, 42, 0.95);
    }

    .sidebar {
      background: rgba(15, 23, 42, 0.9);
      padding: 2rem;
      display: grid;
      gap: 1rem;
    }

    .hero {
      display: grid;
      gap: 0.75rem;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.8rem);
    }

    .hero p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.75;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    select,
    button {
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 0.95rem;
      padding: 0.95rem 1rem;
      font-size: 1rem;
      color: #eef2ff;
      background: rgba(15, 23, 42, 0.96);
    }

    select {
      min-width: 180px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(59, 130, 246, 0.16));
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.26), rgba(59, 130, 246, 0.24));
    }

    .layout {
      display: grid;
      gap: 1rem;
    }

    .stage {
      padding: 0.85rem 1rem;
      border-radius: 1rem;
      text-align: center;
      background: rgba(148, 163, 184, 0.12);
      color: #dbeafe;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .seat-map {
      display: grid;
      gap: 0.5rem;
      justify-content: center;
    }

    .seat-row {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }

    .seat {
      width: 36px;
      height: 36px;
      border-radius: 0.8rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: #e2e8f0;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .seat:hover {
      transform: translateY(-1px);
    }

    .seat.available { background: rgba(56, 189, 248, 0.18); }
    .seat.selected { background: rgba(59, 130, 246, 0.8); border-color: #38bdf8; }
    .seat.sold { background: rgba(100, 116, 139, 0.3); color: #94a3b8; cursor: not-allowed; }
    .seat.vip { box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.3); }
    .seat.r { box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.3); }
    .seat.s { box-shadow: inset 0 0 0 1px rgba(165, 180, 252, 0.3); }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #cbd5e1;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: inline-block;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .dot-available { background: rgba(56, 189, 248, 0.18); }
    .dot-selected { background: rgba(59, 130, 246, 0.8); }
    .dot-sold { background: rgba(100, 116, 139, 0.3); }
    .dot-vip { background: rgba(248, 113, 113, 0.4); }
    .dot-r { background: rgba(34, 211, 238, 0.4); }
    .dot-s { background: rgba(165, 180, 252, 0.4); }

    .summary-box {
      display: grid;
      gap: 0.9rem;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 1.2rem;
      padding: 1.3rem;
    }

    .summary-box h2 {
      margin: 0;
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .summary-list {
      display: grid;
      gap: 0.75rem;
    }

    .summary-list div {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: #cbd5e1;
    }

    .summary-list div strong {
      color: #eef2ff;
    }

    .seat-info {
      display: grid;
      gap: 0.65rem;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .seat-info strong {
      color: #f8fafc;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .back-link {
      color: #94a3b8;
      text-decoration: none;
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 0.85rem 1rem;
      border-radius: 0.95rem;
      background: rgba(15, 23, 42, 0.9);
      transition: background 0.2s ease;
    }

    .back-link:hover {
      background: rgba(56, 189, 248, 0.08);
    }

    @media (max-width: 1040px) {
      .page { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .content { padding: 1.5rem; }
      .seat-row .seat { width: 32px; height: 32px; }
    }

    @media (max-width: 520px) {
      .hero h1 { font-size: 2rem; }
      .toolbar { flex-direction: column; align-items: stretch; }
      select, button { width: 100%; }
    }
  </style>
</head>
<body>
  <article class="page">
    <section class="main">
      <div class="hero">
        <h1>콘서트 좌석 선택</h1>
        <p>좌석 등급과 개별 좌석을 직접 클릭하여 예약할 수 있는 인터페이스입니다. 선택한 좌석은 실시간으로 총 금액과 잔여 좌석 수에 반영됩니다.</p>
      </div>

      <div class="toolbar">
        <select id="concertSelect"></select>
        <button id="resetSelectionBtn" type="button">선택 초기화</button>
      </div>

      <div class="layout">
        <div class="stage">STAGE</div>
        <div class="seat-map" id="seatMap"></div>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot dot-vip"></span>VIP</div>
          <div class="legend-item"><span class="legend-dot dot-r"></span>R석</div>
          <div class="legend-item"><span class="legend-dot dot-s"></span>S석</div>
          <div class="legend-item"><span class="legend-dot dot-available"></span>선택 가능</div>
          <div class="legend-item"><span class="legend-dot dot-selected"></span>선택됨</div>
          <div class="legend-item"><span class="legend-dot dot-sold"></span>판매 완료</div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="summary-box">
        <h2>예약 요약</h2>
        <div class="summary-list">
          <div><span>공연</span><strong id="summaryConcert">-</strong></div>
          <div><span>선택 좌석</span><strong id="summarySeats">0개</strong></div>
          <div><span>총 금액</span><strong id="summaryTotal">0원</strong></div>
        </div>
      </div>

      <div class="seat-info">
        <div><strong id="selectedSeatLabel">선택된 좌석 없음</strong></div>
        <div>VIP 가격: <strong id="priceVIP">-원</strong></div>
        <div>R석 가격: <strong id="priceR">-원</strong></div>
        <div>S석 가격: <strong id="priceS">-원</strong></div>
      </div>

      <button id="reserveBtn" type="button">예약 확정</button>
      <div class="footer">
        <a class="back-link" href="index.html">메인으로 돌아가기</a>
      </div>
    </aside>
  </article>

  <script>
    const concerts = [
      {
        id: 'starry-night',
        name: '스타리 나이트 콘서트',
        price: { VIP: 150000, R: 110000, S: 75000 },
        layout: [
          'VVVVVVV',
          'VVVVVVV',
          'RRRRRRR',
          'RRRRRRR',
          'SSSSSSS',
          'SSSSSSS',
        ],
      },
      {
        id: 'summer-beats',
        name: '서머 비트 페스티벌',
        price: { VIP: 170000, R: 125000, S: 85000 },
        layout: [
          'VVVVVVV',
          'VVVVVVV',
          'RRRRRRR',
          'RRRRRRR',
          'SSSSSSS',
          'SSSSSSS',
        ],
      },
      {
        id: 'retro-gala',
        name: '레트로 갤라',
        price: { VIP: 160000, R: 120000, S: 80000 },
        layout: [
          'VVVVVVV',
          'VVVVVVV',
          'RRRRRRR',
          'RRRRRRR',
          'SSSSSSS',
          'SSSSSSS',
        ],
      },
    ];

    const STORAGE_KEY = 'concert-seat-selection-v1';

    const concertSelect = document.getElementById('concertSelect');
    const seatMap = document.getElementById('seatMap');
    const resetSelectionBtn = document.getElementById('resetSelectionBtn');
    const reserveBtn = document.getElementById('reserveBtn');
    const summaryConcert = document.getElementById('summaryConcert');
    const summarySeats = document.getElementById('summarySeats');
    const summaryTotal = document.getElementById('summaryTotal');
    const selectedSeatLabel = document.getElementById('selectedSeatLabel');
    const priceVIP = document.getElementById('priceVIP');
    const priceR = document.getElementById('priceR');
    const priceS = document.getElementById('priceS');

    let currentConcert = concerts[0];
    let selections = [];
    let soldSeats = {};

    function buildConcertOptions() {
      concertSelect.innerHTML = concerts
        .map((concert) => `<option value="${concert.id}">${concert.name}</option>`)
        .join('');
    }

    function getSavedState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return null;
      try {
        return JSON.parse(saved);
      } catch {
        localStorage.removeItem(STORAGE_KEY);
        return null;
      }
    }

    function saveState() {
      const data = {
        concertId: currentConcert.id,
        soldSeats,
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadState() {
      const saved = getSavedState();
      if (!saved) return;
      const concert = concerts.find((item) => item.id === saved.concertId);
      if (!concert) return;
      currentConcert = concert;
      soldSeats = saved.soldSeats || {};
      concertSelect.value = currentConcert.id;
    }

    function seatKey(row, col) {
      return `${row}-${col}`;
    }

    function seatLabel(row, col) {
      const rowLabel = String.fromCharCode(65 + row);
      return `${rowLabel}${col + 1}`;
    }

    function sectionForSeat(row) {
      const type = currentConcert.layout[row]?.[0];
      if (type === 'V') return 'VIP';
      if (type === 'R') return 'R';
      return 'S';
    }

    function renderSeatMap() {
      seatMap.innerHTML = '';
      currentConcert.layout.forEach((rowLayout, rowIndex) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'seat-row';
        [...rowLayout].forEach((type, colIndex) => {
          const key = seatKey(rowIndex, colIndex);
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `seat ${type === 'V' ? 'vip' : type === 'R' ? 'r' : 's'}`;
          const isSold = soldSeats[currentConcert.id]?.includes(key);
          if (isSold) {
            button.classList.add('sold');
            button.disabled = true;
          } else {
            button.classList.add('available');
          }
          if (selections.includes(key)) {
            button.classList.add('selected');
          }
          button.textContent = seatLabel(rowIndex, colIndex);
          button.dataset.row = rowIndex;
          button.dataset.col = colIndex;
          button.dataset.type = sectionForSeat(rowIndex);
          button.addEventListener('click', () => toggleSeatSelection(key, rowIndex, colIndex));
          rowEl.appendChild(button);
        });
        seatMap.appendChild(rowEl);
      });
      updateSummary();
    }

    function toggleSeatSelection(key, row, col) {
      const sold = soldSeats[currentConcert.id] || [];
      if (sold.includes(key)) return;
      const selectedIndex = selections.indexOf(key);
      if (selectedIndex >= 0) {
        selections.splice(selectedIndex, 1);
      } else {
        selections.push(key);
      }
      renderSeatMap();
    }

    function updateSummary() {
      const total = selections.reduce((sum, key) => {
        const [row, col] = key.split('-').map(Number);
        const section = sectionForSeat(row);
        return sum + currentConcert.price[section];
      }, 0);
      summaryConcert.textContent = currentConcert.name;
      summarySeats.textContent = `${selections.length}개`;
      summaryTotal.textContent = `${total.toLocaleString()}원`;
      selectedSeatLabel.textContent = selections.length
        ? selections.map((key) => {
            const [row, col] = key.split('-').map(Number);
            return seatLabel(row, col);
          }).join(', ')
        : '선택된 좌석 없음';
      priceVIP.textContent = `${currentConcert.price.VIP.toLocaleString()}원`;
      priceR.textContent = `${currentConcert.price.R.toLocaleString()}원`;
      priceS.textContent = `${currentConcert.price.S.toLocaleString()}원`;
    }

    function resetSelection() {
      selections = [];
      renderSeatMap();
    }

    function reserveSeats() {
      if (selections.length === 0) {
        alert('좌석을 먼저 선택하세요.');
        return;
      }
      if (!soldSeats[currentConcert.id]) soldSeats[currentConcert.id] = [];
      soldSeats[currentConcert.id] = [...soldSeats[currentConcert.id], ...selections];
      saveState();
      resetSelection();
      renderSeatMap();
      alert('예약이 완료되었습니다.');
    }

    function updateConcert() {
      const selected = concerts.find((concert) => concert.id === concertSelect.value);
      if (!selected) return;
      currentConcert = selected;
      selections = [];
      renderSeatMap();
    }

    concertSelect.addEventListener('change', updateConcert);
    resetSelectionBtn.addEventListener('click', resetSelection);
    reserveBtn.addEventListener('click', reserveSeats);

    function initialize() {
      buildConcertOptions();
      loadState();
      renderSeatMap();
    }

    initialize();
  </script>
</body>
</html>
